<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_deadlift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005137" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#121c2a" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_deadlift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#85f8c4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#85f8c4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_deadlift)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_deadlift)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <!-- Barbell on floor/shin -->
            <line x1="130" y1="260" x2="350" y2="260" stroke="#85f8c4" stroke-width="8" stroke-linecap="round" />
            <circle cx="140" cy="260" r="32" fill="#00855d" />
            <circle cx="340" cy="260" r="32" fill="#00855d" />
            <!-- Head & Torso -->
            <circle cx="215" cy="135" r="18" fill="#e1e3e4" />
            <path d="M 215 150 L 260 215" stroke="#191c1d" stroke-width="24" stroke-linecap="round" />
            <!-- Arms down gripping bar -->
            <path d="M 225 165 L 235 255" stroke="#3d4a42" stroke-width="14" stroke-linecap="round" />
            <!-- Legs hinged -->
            <path d="M 260 215 L 270 250 L 255 300" fill="none" stroke="#006948" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#005137" text-anchor="middle">Hamstrings</text>
  </g>
</svg>