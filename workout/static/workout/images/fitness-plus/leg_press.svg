<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_leg_press" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005137" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#006780" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_leg_press" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b7eaff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b7eaff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_leg_press)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_leg_press)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <!-- Seat and Incline Frame -->
            <line x1="140" y1="260" x2="190" y2="180" stroke="#525d6c" stroke-width="14" stroke-linecap="round" />
            <circle cx="180" cy="160" r="16" fill="#e1e3e4" />
            <!-- Legs pressing sled up-right -->
            <path d="M 210 240 L 260 170 L 310 130" fill="none" stroke="#b7eaff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Sled Plate -->
            <rect x="300" y="100" width="20" height="70" rx="4" transform="rotate(-30 300 100)" fill="#00855d" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#005137" text-anchor="middle">Quadriceps</text>
  </g>
</svg>