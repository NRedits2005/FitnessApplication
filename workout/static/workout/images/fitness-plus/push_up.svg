<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_push_up" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00855d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3d4756" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_push_up" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#85f8c4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#85f8c4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_push_up)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_push_up)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <!-- Floor -->
            <line x1="100" y1="280" x2="380" y2="280" stroke="#bccac0" stroke-width="4" />
            <!-- Body in plank straight line -->
            <circle cx="150" cy="205" r="16" fill="#e1e3e4" />
            <path d="M 160 215 L 320 250" stroke="#191c1d" stroke-width="22" stroke-linecap="round" />
            <!-- Arms pushing from floor -->
            <path d="M 180 220 L 195 245 L 190 280" fill="none" stroke="#85f8c4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Feet on floor -->
            <circle cx="325" cy="275" r="8" fill="#525d6c" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#00855d" text-anchor="middle">Chest, Core</text>
  </g>
</svg>