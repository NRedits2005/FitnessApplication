<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_mountain_climbers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006948" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ba1a1a" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_mountain_climbers" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#85f8c4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#85f8c4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_mountain_climbers)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_mountain_climbers)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <line x1="90" y1="280" x2="390" y2="280" stroke="#bccac0" stroke-width="4" />
            <circle cx="150" cy="190" r="16" fill="#e1e3e4" />
            <!-- High plank torso -->
            <path d="M 160 200 L 280 180" stroke="#191c1d" stroke-width="22" stroke-linecap="round" />
            <!-- Hands straight -->
            <line x1="170" y1="205" x2="165" y2="280" stroke="#3d4a42" stroke-width="12" stroke-linecap="round" />
            <!-- Driving knee forward, back leg extended -->
            <path d="M 270 185 L 215 225 L 220 260" fill="none" stroke="#85f8c4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 280 180 L 340 235 L 345 280" fill="none" stroke="#525d6c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#006948" text-anchor="middle">Core</text>
  </g>
</svg>