<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_running" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006780" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00855d" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_running" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#76dcff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#76dcff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_running)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_running)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <!-- Head & leaning torso -->
            <circle cx="250" cy="100" r="18" fill="#e1e3e4" />
            <path d="M 245 120 L 230 200" stroke="#191c1d" stroke-width="24" stroke-linecap="round" />
            <!-- Pumping arms -->
            <path d="M 240 140 L 205 160 L 220 185" fill="none" stroke="#76dcff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 240 140 L 275 160 L 265 195" fill="none" stroke="#3d4a42" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Sprinting legs -->
            <path d="M 230 200 L 285 225 L 260 290" fill="none" stroke="#00855d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 230 200 L 175 240 L 160 290" fill="none" stroke="#006780" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#006780" text-anchor="middle">Cardiovascular</text>
  </g>
</svg>