<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_shoulder_press" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006948" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6b7586" stop-opacity="0.22" />
    </linearGradient>
    <radialGradient id="glow_shoulder_press" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#85f8c4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#85f8c4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Card Canvas -->
  <rect width="480" height="360" rx="20" fill="#f3f4f5" />
  <rect width="480" height="360" rx="20" fill="url(#grad_shoulder_press)" />
  <circle cx="240" cy="180" r="130" fill="url(#glow_shoulder_press)" />
  
  <!-- Grid Accent Lines -->
  <line x1="40" y1="180" x2="440" y2="180" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="240" y1="40" x2="240" y2="320" stroke="#bccac0" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Exercise Artwork -->
  
            <!-- Head & Torso -->
            <circle cx="240" cy="140" r="18" fill="#e1e3e4" />
            <path d="M 240 160 L 240 260" stroke="#191c1d" stroke-width="26" stroke-linecap="round" />
            <!-- Dumbbells overhead -->
            <path d="M 170 180 L 170 95" stroke="#3d4a42" stroke-width="12" stroke-linecap="round" />
            <path d="M 310 180 L 310 95" stroke="#3d4a42" stroke-width="12" stroke-linecap="round" />
            <rect x="150" y="80" width="40" height="15" rx="4" fill="#00855d" />
            <rect x="290" y="80" width="40" height="15" rx="4" fill="#00855d" />
        

  <!-- Badge / Tag -->
  <g transform="translate(24, 24)">
    <rect width="130" height="32" rx="16" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.08))" />
    <text x="65" y="21" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#006948" text-anchor="middle">Deltoids</text>
  </g>
</svg>